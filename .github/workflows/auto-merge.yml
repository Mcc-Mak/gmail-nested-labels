name: Auto-merge

on:
  push:
    branches:
      - dev-001

permissions:
  contents: write

concurrency:
  group: auto-merge
  cancel-in-progress: true

jobs:
  merge-to-dev:
    name: dev-001 -> dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev-001 into dev
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge origin/dev-001 --no-edit
          for attempt in 1 2 3; do
            if git push origin dev; then
              echo "Pushed dev successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; re-fetching and retrying in 5s..."
            sleep 5
            git fetch origin dev
            git checkout -B dev origin/dev
            git merge origin/dev-001 --no-edit
          done
          echo "ERROR: failed to push dev after 3 attempts" >&2
          exit 1

  merge-to-main:
    name: dev -> main
    needs: merge-to-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git fetch origin dev main
          git checkout -B dev origin/dev
          git checkout -B main origin/main
          git merge dev --no-edit
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed main successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; re-fetching and retrying in 5s..."
            sleep 5
            git fetch origin main
            git checkout -B main origin/main
            git merge dev --no-edit
          done
          echo "ERROR: failed to push main after 3 attempts" >&2
          exit 1
